kind = "web"
previewPath = "/"
title = "Portfólio Caio Melo"
description = "Portfólio pessoal de Caio Melo, acadêmico de Engenharia de Software e desenvolvedor em evolução, com foco em web, backend, IA e DevOps."
version = "1.0.0"
id = "artifacts/caio-melo-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21573

[services.development]
run = "pnpm --filter @workspace/caio-melo-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/caio-melo-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/caio-melo-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21573"
BASE_PATH = "/"
